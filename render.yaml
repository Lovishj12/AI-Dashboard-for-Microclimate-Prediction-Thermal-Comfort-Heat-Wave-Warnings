services:
  # FastAPI Analytical Backend Web Service
  - type: web
    name: btp-microclimate-backend
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python -m uvicorn src.api_server:app --host 0.0.0.0 --port "
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9

  # Vite React Frontend Static Site
  - type: static_site
    name: btp-microclimate-dashboard
    plan: free
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: "frontend/dist"
    routes:
      - type: rewrite
        source: "/*"
        destination: "/index.html"
